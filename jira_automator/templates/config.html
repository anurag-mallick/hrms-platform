<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuration - Jira Automator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 50px; }
        .container { max-width: 600px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-primary { background-color: #0052CC; border-color: #0052CC; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center mb-4">App Configuration</h2>
        <form id="configForm">
            <div class="mb-3">
                <label class="form-label">Connection Mode</label>
                <select class="form-select" id="mode" name="mode">
                    <option value="api" {% if config.mode == 'api' %}selected{% endif %}>API Token (Recommended)</option>
                    <option value="browser" {% if config.mode == 'browser' %}selected{% endif %}>Browser Automation</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Jira Base URL</label>
                <input type="text" class="form-control" id="base_url" name="base_url" value="{{ config.base_url }}" placeholder="https://yourcompany.atlassian.net" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Jira Email</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ config.email }}" placeholder="you@company.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label" id="secretLabel">API Token / Password</label>
                <input type="password" class="form-control" id="secret" name="secret" value="{{ config.secret }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Default Project Key</label>
                <input type="text" class="form-control" id="default_project" name="default_project" value="{{ config.default_project }}" placeholder="ENG" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Assignee List (one per line)</label>
                <textarea class="form-control" id="assignees" name="assignees" rows="6" placeholder="Harini M&#10;BLUSPRING ENTERPRISES LIMITED&#10;nandakumar.p&#10;Deepika P R&#10;Ganesh Y&#10;kannan.p&#10;M R Kiran&#10;Karunamurthy G&#10;B Varshitha"></textarea>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Save Configuration</button>
            </div>
        </form>
        <div id="result" class="mt-3 alert" style="display:none;"></div>
    </div>

    <script>
        const form = document.getElementById('configForm');
        const modeSelect = document.getElementById('mode');
        const secretLabel = document.getElementById('secretLabel');

        modeSelect.onchange = () => {
            secretLabel.innerText = modeSelect.value === 'api' ? 'API Token' : 'Password';
        };

        form.onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('/save-config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                const resultDiv = document.getElementById('result');
                resultDiv.style.display = 'block';
                if (result.success) {
                    resultDiv.className = 'mt-3 alert alert-success';
                    resultDiv.innerText = 'Configuration saved! Redirecting...';
                    setTimeout(() => window.location.href = '/', 1500);
                } else {
                    resultDiv.className = 'mt-3 alert alert-danger';
                    resultDiv.innerText = 'Error: ' + result.error;
                }
            } catch (error) {
                alert('Network error: ' + error.message);
            }
        };
    </script>
</body>
</html>
